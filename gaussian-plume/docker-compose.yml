# Docker Compose：一次构建同时起 Gaussian-Plume 服务与 PostgreSQL 16。
# 用法：docker compose up --build
services:
  db:
    image: postgres:16
    container_name: plume-db
    environment:
      POSTGRES_USER: plume
      POSTGRES_PASSWORD: plume
      POSTGRES_DB: plume
    volumes:
      - plume_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # 服务进程就绪不代表可接受连接，用 pg_isready 卡到真就绪。
      test: ["CMD-SHELL", "pg_isready -U plume -d plume"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plume-api
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://plume:plume@db:5432/plume?sslmode=disable"
      SEED_DEMO: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  plume_pgdata:
